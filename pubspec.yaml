name: harry_potter_sorting_flutter
description: "A Harry Potter Magic Sorting Hat application in Flutter"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+4

environment:
  sdk: ^3.5.0


dependencies:
  auto_route: ^9.3.0+1
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  drift: ^2.24.0
  drift_flutter: ^0.2.4
  fake_async: ^1.3.3
  flutter:
    sdk: flutter
  get_it: ^8.0.3
  json_annotation: ^4.9.0
  provider: ^6.1.2
  retrofit: ^4.4.1
  skeletonizer: ^2.1.3

dev_dependencies:
  auto_route_generator: ^9.3.1
  build_runner: ^2.4.13
  drift_dev: ^2.24.0
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.9.0
  retrofit_generator: ^9.1.5

dependency_overrides:
  analyzer: 7.3.0
  analyzer_plugin: 0.12.0
  build_daemon: 4.0.1
  build_runner: 2.4.15
  dart_style: 2.3.7
  test_api: 0.7.10
  test_core: 0.6.17

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/house_crests/

  fonts:
    - family: HarryP
      fonts:
        - asset: fonts/harry_p.ttf
